<!DOCTYPE html>
<html>
<head>
    <title>Scroll Prison</title>

    <style>
        body {
            width: 220px;
            text-align: center;
            font-family: Arial;
            padding: 15px;
        }

        h2 {
            margin-top: 0;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h2>🔒 Scroll Prison</h2>

    <p>Scrolling up is forbidden.</p>

    <button id="escape">FREE ME</button>

    <script>
        document.getElementById("escape").onclick = () => {
            alert("😂 You thought you escaped...");
        };
    </script>

</body>
</html>
